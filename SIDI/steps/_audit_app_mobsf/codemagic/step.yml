name: "[AUDIT] - Install and run MobSF"
ignore_failure: true
script: |
 #!/bin/bash
 set -ex

 install_dependencies() {
   echo ":snake: Installing Python dependencies (mobsfscan)..."
   pip3 install --upgrade mobsfscan
 }
 
 set_threshold_level() {
   UPPER_THRESHOLD=$(echo "$MOBSF_THRESHOLD" | tr '[:lower:]' '[:upper:]')
   echo ":hammer_and_wrench:  Setting threshold level: $UPPER_THRESHOLD"
   case "$UPPER_THRESHOLD" in
     "INFO") THRESHOLD_LEVEL=1 ;;
     "WARNING") THRESHOLD_LEVEL=2 ;;
     "ERROR") THRESHOLD_LEVEL=3 ;;
     *)
       echo ":x: Unknown threshold level: $UPPER_THRESHOLD"
       exit 1
       ;;
   esac
 }
 
 run_scan() {
   echo ":mag: Scanning project at $MOBSF_CHECK_PATH ..."
   mobsfscan "$MOBSF_CHECK_PATH" --json -o "$CM_EXPORT_DIR/mobsf-report.json" --no-fail
   mobsfscan "$MOBSF_CHECK_PATH" --html -o "$CM_EXPORT_DIR/mobsf-report.html" --no-fail
 }
 
 validate_report_file() {
   REPORT_FILE="$CM_EXPORT_DIR/mobsf-report.json"
   if [[ ! -f "$REPORT_FILE" ]]; then
     echo ":x: Report file not found: $REPORT_FILE"
     exit 1
   fi
   echo ":page_facing_up: JSON report found: $REPORT_FILE"
 }
 
 evaluate_findings() {
   local severities
   severities=$(jq -r '.results[]?.metadata.severity' "$REPORT_FILE")
 
   if [[ -z "$severities" ]]; then
     echo ":warning:  No findings detected in the report."
     exit 0
   fi
 
   echo ":test_tube: Evaluating findings based on threshold..."
   for severity in $severities; do
     case "$severity" in
       "ERROR")
         echo ":rotating_light: Report contains **ERROR** CVEs. Check $REPORT_FILE for details."
         exit 1
         ;;
       "WARNING")
         if [[ $THRESHOLD_LEVEL -ge 2 ]]; then
           echo ":warning:  Report contains **WARNING** CVEs. Check $REPORT_FILE for details."
           exit 1
         fi
         ;;
       "INFO")
         if [[ $THRESHOLD_LEVEL -ge 1 ]]; then
           echo ":information_source:  Report contains **INFO** CVEs. Check $REPORT_FILE for details."
           exit 1
         fi
         ;;
     esac
   done
 
   echo ":white_check_mark: No CVEs found that exceed the threshold: $UPPER_THRESHOLD"
 }

 install_dependencies
 set_threshold_level
 run_scan
 validate_report_file
 evaluate_findings