steps:
   - script@1.2.1:
        inputs:
           - content: |-
                #!/usr/bin/env bash
                set -e

                echo "🐍 Installing Python dependencies (mobsfscan)..."
                pip3 install --upgrade mobsfscan
        title: "[AUDIT] - Install MobSF"
   - script@1.2.1:
        inputs:
           - content: |-
                #!/usr/bin/env bash
                set -e

                JSON_REPORT_FILE_PATH="/Users/vagrant/deploy/mobsf-report.json"
                UPPER_THRESHOLD=$(echo "$MOBSF_THRESHOLD" | tr '[:lower:]' '[:upper:]')
                
                echo "🛠️  Setting threshold level: $UPPER_THRESHOLD"
                case "$UPPER_THRESHOLD" in
                   "INFO")
                   THRESHOLD_LEVEL=1
                   ;;
                   "WARNING")
                   THRESHOLD_LEVEL=2
                   ;;
                   "ERROR")
                   THRESHOLD_LEVEL=3
                   ;;
                   *)
                   echo "❌ Unknown threshold level: $UPPER_THRESHOLD"
                   exit 1
                   ;;
                esac
                
                echo "🔍 Scanning project at $MOBSF_CHECK_PATH..."
                mobsfscan "$MOBSF_CHECK_PATH" --json -o "/Users/vagrant/deploy/mobsf-report.json" --no-fail
                mobsfscan "$MOBSF_CHECK_PATH" --html -o "/Users/vagrant/deploy/mobsf-report.html" --no-fail
                
                # -------- Check if report file exists --------
                if [[ ! -f "$JSON_REPORT_FILE_PATH" ]]; then
                   echo "❌ Report file not found: $JSON_REPORT_FILE_PATH"
                   exit 1
                fi
                echo "📄 JSON report found: $JSON_REPORT_FILE_PATH"
                
                # -------- Parse and Analyze Report --------
                SEVERITIES=$(jq -r '.results[]?.metadata.severity' "$JSON_REPORT_FILE_PATH")
                
                if [[ -z "$SEVERITIES" ]]; then
                   echo "⚠️  No findings detected in the report."
                   exit 1
                fi
                
                echo "🧪 Evaluating findings based on threshold..."
                
                for severity in $SEVERITIES; do
                   if [[ "$severity" == "ERROR" ]]; then
                   echo "🚨 Report contains **ERROR** CVEs. Check $JSON_REPORT_FILE_PATH for details."
                   exit 1
                   fi
                   if [[ "$severity" == "WARNING" && $THRESHOLD_LEVEL -ge 2 ]]; then
                   echo "⚠️  Report contains **WARNING** CVEs. Check $JSON_REPORT_FILE_PATH for details."
                   exit 1
                   fi
                   if [[ "$severity" == "INFO" && $THRESHOLD_LEVEL -ge 1 ]]; then
                   echo "ℹ️  Report contains **INFO** CVEs. Check $JSON_REPORT_FILE_PATH for details."
                   exit 1
                   fi
                done
                
                echo "✅ No CVEs found that exceed the threshold: $UPPER_THRESHOLD"
        title: "[AUDIT] - Run MobSF"